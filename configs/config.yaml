# Global project configuration.
# Individual modules (SUMO env, training scripts) will read from this file
# instead of hardcoding paths or hyperparameters. Later phases will add
# reward_config.yaml and scenarios.yaml alongside this one.

project:
  name: "traffic-signal-ai"
  seed: 42

paths:
  sumo_networks: "sumo/networks"
  sumo_routes: "sumo/routes"
  sumo_configs: "sumo/configs"
  models: "models"
  results: "results"

# Placeholder sections — filled in as their phases arrive.
simulation: {}
agent:
  dqn:
    hidden_dim: 128
    learning_rate: 0.001
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    target_update_freq: 500
    buffer_capacity: 50000
    batch_size: 64
reward: {}